<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Freelance Connect</title>
    </head>
    <body>
        <form action="/traitement" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Identité</legend>
                <input type="hidden" name="source" value="inscription_web">
                <label for="firstname">Nom</label>
                <input type="text" id="firstname" name="firstname" placeholder="Ex : Doe" required>
                <label for="lastname">Prénom</label>
                <input type="text" id="lastname" name="lastname" placeholder="Ex : John" autofocus required>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" minlength="8" required>
                <label for="upload">Photo de profil</label>
                <input type="file" id="upload" name="upload" accept=".png,.jpg" required>
            </fieldset>
            <fieldset>
                <legend>Contact & profil</legend>
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Numéro de téléphone</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
                <label for="portfolio">Portfolio</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="Ex : https://monportfolio.com">
                <label for="color">Couleur</label>
                <input type="color" id="color" name="color" value="#3eaca5">
            </fieldset>
            <fieldset>
                <legend>Informations professionnelles</legend> 
                <label for="experiences">Expériences</label>
                <input type="number" id="experiences" name="experiences" min="0" max="50" required>
                <label for="tjm">Taux Journalier Moyen</label>
                <input type="number" id="tjm" name="tjm" step="50" required>
                <label for="seniorite">Niveau de seniorité estimé</label>
                <input type="range" id="seniorite" name="seniorite" min="1" max="5" required>
            <div>
                <label for="language">Langages maîtrisés</label>
                <input type="checkbox" id="language" name="language" value="Python" checked>Python
                <input type="checkbox" id="language" name="language" value="HTML">HTML
                <input type="checkbox" id="language" name="language" value="CSS">CSS
                <input type="checkbox" id="language" name="language" value="JavaScript" >JavaScript
            </div>
            <div>
                <label for="status">Statut juridique</label>
                <input type="radio" id="status" name="status" value="auto-entrepreneur" checked>Auto-entrepreneur 
                <input type="radio" id="status" name="status" value="sasu">SASU
                <input type="radio" id="status" name="status" value="eurl">EURL
            </div>
                <label for="region">Région d'intervention</label>
                <select type="select" id="region" name="region" required>
                    <optgroup name="Sélectionnez une région">
                        <option value="nord">Groupe Nord</option>
                        <option value="sud">Groupe Sud</option>
                    </optgroup>
                </select>
            </fieldset>
            <fieldset>
                <legend>Disponibité et finalisations</legend>
                <label for="new-username">Nom d'utilisateur</label>
                <input type="text" id="new-username" name="new-username" required>
                <label for="new-password">Mot de passe</label>
                <input type="password" id="new-password" name="new-password" required>
                <button type="submit">S'inscrire</button>
            </fieldset>
            <fieldset>
                <legend>Mot de passe oublié</legend>
                <label for="forgot-password">Adresse e-mail</label>
                <input type="email" id="forgot-password" name="forgot-password" required>
                <button type="submit">Réinitialiser le mot de passe</button>
            
        <h1>Bienvenue sur Freelance Connect</h1>
        <p>Connectez-vous avec des freelances talentueux pour vos projets.</p>
    </body>
</html>
